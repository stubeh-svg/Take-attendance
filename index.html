<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平板班級點名系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; padding: 15px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #334155; }
    select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; margin-top: 10px; }
    
    /* 學生卡片基礎樣式 */
    .student-card { border: 2px solid #cbd5e1; border-radius: 8px; padding: 10px; text-align: center; background: #ffffff; cursor: pointer; transition: all 0.2s; }
    .student-name { font-weight: bold; margin-bottom: 6px; color: #0f172a; font-size: 16px; }
    .type-select { width: 100%; padding: 5px; font-size: 14px; border-radius: 6px; display: none; font-weight: bold; }

    /* 各假別選取時的顏色樣式 */
    .student-card.selected { border-width: 2px; }
    .student-card.selected .type-select { display: block; }

    .student-card.type-曠課 { border-color: #dc2626; background: #fef2f2; }
    .student-card.type-曠課 .type-select { border: 1px solid #dc2626; color: #dc2626; }

    .student-card.type-病假 { border-color: #2563eb; background: #eff6ff; }
    .student-card.type-病假 .type-select { border: 1px solid #2563eb; color: #2563eb; }

    .student-card.type-事假 { border-color: #d97706; background: #fffbeb; }
    .student-card.type-事假 .type-select { border: 1px solid #d97706; color: #d97706; }

    .student-card.type-喪假 { border-color: #475569; background: #f8fafc; }
    .student-card.type-喪假 .type-select { border: 1px solid #475569; color: #475569; }

    .student-card.type-公假 { border-color: #7c3aed; background: #f5f3ff; }
    .student-card.type-公假 .type-select { border: 1px solid #7c3aed; color: #7c3aed; }

    .student-card.type-生理假 { border-color: #db2777; background: #fdf2f8; }
    .student-card.type-生理假 .type-select { border: 1px solid #db2777; color: #db2777; }

    .student-card.type-不可抗力假 { border-color: #0d9488; background: #f0fdf4; }
    .student-card.type-不可抗力假 .type-select { border: 1px solid #0d9488; color: #0d9488; }
    
    .btn-submit { background: #2563eb; color: white; border: none; margin-top: 20px; font-weight: bold; cursor: pointer; font-size: 18px; }
    .btn-submit:disabled { background: #94a3b8; }
    .loading-msg { text-align: center; color: #64748b; padding: 20px 0; grid-column: 1 / -1; }
  </style>
</head>
<body>

<div class="card">
  <h2>班級點名系統</h2>
  
  <div class="form-group">
    <label for="classSelect">選擇班級</label>
    <select id="classSelect" onchange="renderStudents()">
      <option value="">-- 載入名單中 --</option>
    </select>
  </div>

  <div class="form-group">
    <label>點擊學生登記缺曠：</label>
    <div id="studentContainer" class="student-grid">
      <div class="loading-msg">正在連線取得學生名單...</div>
    </div>
  </div>

  <button type="button" class="btn-submit" id="submitBtn" onclick="submitData()">送出點名紀錄</button>
</div>

<script>
  // ⚠️ 請替換為你的 GAS 部署網址 ⚠️
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyEy9Ju1JMJoBWC4PbJ1rT9ODeNdpvySF_Gqh0CGvkuEOMm9fpUAXqOibLNnq7NhWl7/exec";

  const LEAVE_TYPES = ["曠課", "病假", "事假", "喪假", "公假", "生理假", "不可抗力假"];
  let allStudentsData = {};

  function loadStudentData() {
    const script = document.createElement('script');
    script.src = `${GAS_URL}?action=getStudents&callback=handleStudentData&_=${new Date().getTime()}`;
    document.body.appendChild(script);
  }

  window.handleStudentData = function(response) {
    const studentsObj = response.students || response.data || response;

    if (studentsObj && Object.keys(studentsObj).length > 0) {
      allStudentsData = studentsObj;
      const classSelect = document.getElementById('classSelect');
      classSelect.innerHTML = '<option value="">-- 請選擇班級 --</option>';

      Object.keys(allStudentsData).forEach(className => {
        if (Array.isArray(allStudentsData[className])) {
          const option = document.createElement('option');
          option.value = className;
          option.innerText = `${className} 班`;
          classSelect.appendChild(option);
        }
      });

      document.getElementById('studentContainer').innerHTML = '<div class="loading-msg">請從上方選單【選擇班級】</div>';
    }
  };

  function updateCardColor(card, type) {
    // 移除舊的假別 class
    LEAVE_TYPES.forEach(t => card.classList.remove(`type-${t}`));
    if (card.classList.contains('selected')) {
      card.classList.add(`type-${type}`);
    }
  }

  function renderStudents() {
    const className = document.getElementById('classSelect').value;
    const container = document.getElementById('studentContainer');
    container.innerHTML = '';

    if (!className || !allStudentsData[className]) {
      container.innerHTML = '<div class="loading-msg">請選擇班級</div>';
      return;
    }

    const students = allStudentsData[className];
    students.forEach(student => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.dataset.seat = student.seat;
      card.dataset.name = student.name;

      let typeOptions = LEAVE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');

      card.innerHTML = `
        <div class="student-name">${student.seat}號 ${student.name}</div>
        <select class="type-select" onclick="event.stopPropagation()">
          ${typeOptions}
        </select>
      `;

      const selectEl = card.querySelector('.type-select');

      // 點擊卡片切換選取狀態
      card.addEventListener('click', function() {
        this.classList.toggle('selected');
        updateCardColor(this, selectEl.value);
      });

      // 切換假別時即時變更色彩
      selectEl.addEventListener('change', function() {
        updateCardColor(card, this.value);
      });

      container.appendChild(card);
    });
  }

  async function submitData() {
    const className = document.getElementById('classSelect').value;
    if (!className) {
      alert("請先選擇班級！");
      return;
    }

    const selectedCards = document.querySelectorAll('.student-card.selected');
    const records = [];

    selectedCards.forEach(card => {
      const seat = card.dataset.seat;
      const name = card.dataset.name;
      const type = card.querySelector('.type-select').value;
      records.push({ seat, name, type });
    });

    if (records.length === 0) {
      if (!confirm(`【${className} 班】未選取任何缺曠學生，確定要送出（全員到齊）嗎？`)) return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "提交中...";

    try {
      await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ className, records })
      });

      alert("點名紀錄送出成功！");
      renderStudents();
    } catch (err) {
      alert("送出失敗：" + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "送出點名紀錄";
    }
  }

  loadStudentData();
</script>

</body>
</html>
