<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全校缺曠即時動態看板 (智慧彈性版)</title>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background-color: #0f172a; /* 深藍黑色科技感背景 */
      color: #ffffff;
      margin: 0;
      padding: 20px;
      overflow: hidden; /* 防止出現滾動條 */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部標題與狀態列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .title { font-size: 28px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; }
    .page-info { font-size: 22px; font-weight: bold; background: #0284c7; padding: 6px 20px; border-radius: 20px; color: #ffffff; }
    .clock { font-size: 22px; font-weight: bold; color: #94a3b8; }

    /* 班級網格佈局 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      flex-grow: 1;
      align-content: start;
    }

    /* 基本班級卡片 */
    .class-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      border: 2px solid #334155;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* 🌟 人數過多 (超過 4 人) 時自動跨兩欄變寬 */
    .class-card.wide-card {
      grid-column: span 2; 
      border-color: #0284c7; /* 給予深藍邊框強調 */
    }

    .class-title {
      font-size: 20px;
      font-weight: bold;
      border-bottom: 2px solid #475569;
      padding-bottom: 6px;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    /* 全班到齊顯示綠色勾勾 */
    .all-present {
      color: #4ade80;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    /* 單欄學生清單 (預設 1~4 人) */
    .absent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 🌟 多欄學生清單 (5 人以上) */
    .absent-list-multi {
      display: grid;
      gap: 6px 14px;
    }

    /* 單位學生整條：名字純文字、假別色彩網底 */
    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: #e2e8f0;
      padding: 2px 0;
    }

    /* 🎨 假別網底標籤 (與點名介面色彩 100% 同步) */
    .type-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .badge-事假 { background-color: #fef9c3; color: #854d0e; }
    .badge-病假 { background-color: #e0f2fe; color: #075985; }
    .badge-公假 { background-color: #f3e8ff; color: #6b21a8; }
    .badge-生理假 { background-color: #fce7f3; color: #9d174d; }
    .badge-曠課 { background-color: #fee2e2; color: #991b1b; }
    .badge-喪假 { background-color: #f1f5f9; color: #334155; }
    .badge-不可抗力假 { background-color: #ffedd5; color: #9a3412; }
  </style>
</head>
<body>

<div class="header">
  <div class="title">🏫 全校缺曠即時動態看板</div>
  <div id="pageInfo" class="page-info">載入中...</div>
  <div id="clock" class="clock">00:00:00</div>
</div>

<div id="gridContainer" class="dashboard-grid"></div>

<script>
  // ⚠️ 請替換為你的 Google Apps Script Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyEy9Ju1JMJoBWC4PbJ1rT9ODeNdpvySF_Gqh0CGvkuEOMm9fpUAXqOibLNnq7NhWl7/exec";

  // ⚙️ 輪播與更新設定
  const PAGE_ROTATE_MS = 10000; // 每頁輪播停留 10 秒
  const DATA_FETCH_MS = 10000;  // 每 10 秒背景同步最新缺曠資料

  // 年級分頁設定
  const gradePages = [
    { title: "七年級", pattern: /^(7|七)/ },
    { title: "八年級", pattern: /^(8|八)/ },
    { title: "九年級", pattern: /^(9|九)/ }
  ];

  let currentRecords = {};
  let currentGradeIndex = 0;

  // 1. 即時時鐘
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('zh-TW', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. 頁面初始化
  window.onload = function() {
    fetchDashboardData();
    setInterval(fetchDashboardData, DATA_FETCH_MS); // 每 10 秒背景同步最新資料
    setInterval(nextGradePage, PAGE_ROTATE_MS);      // 每 10 秒自動切換年級頁面
  };

  // 3. 向 GAS 抓取最新看板資料
  function fetchDashboardData() {
    const script = document.createElement('script');
    script.src = `${GAS_URL}?action=getDashboardData&callback=renderDashboard`;
    document.body.appendChild(script);
  }

  // 4. 接收資料
  function renderDashboard(response) {
    if (response.status === 'success') {
      currentRecords = response.data;
      displayGradePage();
    }
  }

  // 5. 切換至下一個年級頁面
  function nextGradePage() {
    currentGradeIndex = (currentGradeIndex + 1) % gradePages.length;
    displayGradePage();
  }

  // 6. 渲染指定年級的班級卡片 (含人數極多與全班公假自動摘要)
  function displayGradePage() {
    const container = document.getElementById('gridContainer');
    const pageInfo = document.getElementById('pageInfo');
    
    container.innerHTML = '';
    const currentGrade = gradePages[currentGradeIndex];
    pageInfo.textContent = `顯示中：${currentGrade.title}`;

    const allClasses = Object.keys(currentRecords).sort();
    const gradeClasses = allClasses.filter(className => currentGrade.pattern.test(className));

    if (gradeClasses.length === 0) {
      container.innerHTML = `<div style="font-size:20px; color:#94a3b8; grid-column: 1/-1; text-align:center; padding-top:50px;">尚無 ${currentGrade.title} 班級資料</div>`;
      return;
    }

    gradeClasses.forEach(className => {
      const records = currentRecords[className] || [];
      const card = document.createElement('div');
      const totalAbsent = records.length;

      let contentHtml = `<div class="class-title">${className}</div>`;

      // 情況 1：全班到齊
      if (totalAbsent === 0) {
        card.className = 'class-card';
        contentHtml += `
          <div class="all-present">
            <span>✅</span> 全班到齊
          </div>
        `;
      } 
      // 情況 2：極高人數缺曠 / 全班公假 (超過 18 人) -> 自動啟動「摘要大卡片」
      else if (totalAbsent > 18) {
        card.className = 'class-card wide-card';
        
        // 統計主要假別
        const typeCounts = {};
        records.forEach(item => {
          typeCounts[item.type] = (typeCounts[item.type] || 0) + 1;
        });
        
        // 找出比例最高的假別
        let mainType = Object.keys(typeCounts).reduce((a, b) => typeCounts[a] > typeCounts[b] ? a : b);
        let isAllOfficial = mainType === '公假' && typeCounts['公假'] >= (totalAbsent * 0.8);

        contentHtml += `
          <div style="text-align: center; padding: 10px 0;">
            <div style="font-size: 36px; margin-bottom: 5px;">${isAllOfficial ? '🚌' : '⚠️'}</div>
            <div style="font-size: 22px; font-weight: 900; color: ${isAllOfficial ? '#c084fc' : '#f43f5e'};">
              ${isAllOfficial ? '全班公假 / 校外活動' : '全班多數缺曠'}
            </div>
            <div style="font-size: 16px; color: #94a3b8; margin-top: 6px; font-weight: bold;">
              共 ${totalAbsent} 人未到校 (${mainType} ${typeCounts[mainType]} 人)
            </div>
          </div>
        `;
      } 
      // 情況 3：人數較多 (5 ~ 18 人) -> 跨雙欄，使用密集多欄顯示
      else if (totalAbsent > 4) {
        card.className = 'class-card wide-card';
        
        // 人數 > 10 人開 3 欄；5~10 人開 2 欄
        const gridCols = totalAbsent > 10 ? 'grid-template-columns: repeat(3, 1fr);' : 'grid-template-columns: repeat(2, 1fr);';
        
        contentHtml += `<div class="absent-list-multi" style="${gridCols}">`;
        records.forEach(item => {
          contentHtml += `
            <div class="student-item" style="font-size: ${totalAbsent > 10 ? '14px' : '16px'};">
              <span>${item.seat}號 ${item.name}</span>
              <span class="type-badge badge-${item.type}">${item.type}</span>
            </div>
          `;
        });
        contentHtml += `</div>`;
      } 
      // 情況 4：少數人缺曠 (1 ~ 4 人) -> 標準單欄
      else {
        card.className = 'class-card';
        contentHtml += `<div class="absent-list">`;
        records.forEach(item => {
          contentHtml += `
            <div class="student-item">
              <span>${item.seat}號 ${item.name}</span>
              <span class="type-badge badge-${item.type}">${item.type}</span>
            </div>
          `;
        });
        contentHtml += `</div>`;
      }

      card.innerHTML = contentHtml;
      container.appendChild(card);
    });
  }
</script>

</body>
</html>
