<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全校即時點名統計看板</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 2rem; color: #38bdf8; }
    .meta-info { font-size: 1rem; color: #94a3b8; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .class-card { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .class-title { font-size: 1.4rem; font-weight: bold; border-bottom: 1px solid #475569; padding-bottom: 8px; margin-bottom: 12px; color: #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .badge-all { background: #10b981; color: white; font-size: 0.85rem; padding: 3px 8px; border-radius: 12px; }
    .badge-absent { background: #ef4444; color: white; font-size: 0.85rem; padding: 3px 8px; border-radius: 12px; }
    .student-list { list-style: none; padding: 0; margin: 0; }
    .student-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #334155; font-size: 1.1rem; }
    
    /* 看板假別彩色標籤 */
    .type-tag { padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
    .tag-曠課 { background: #ef4444; color: white; }
    .tag-病假 { background: #3b82f6; color: white; }
    .tag-事假 { background: #f59e0b; color: white; }
    .tag-喪假 { background: #64748b; color: white; }
    .tag-公假 { background: #8b5cf6; color: white; }
    .tag-生理假 { background: #ec4899; color: white; }
    .tag-不可抗力假 { background: #14b8a6; color: white; }

    .all-present { color: #10b981; font-weight: bold; text-align: center; padding: 15px 0; font-size: 1.1rem; }
    .loading-full { text-align: center; font-size: 1.5rem; color: #94a3b8; grid-column: 1 / -1; padding: 50px 0; }
  </style>
</head>
<body>

<div class="header">
  <h1>全校即時缺曠統計看板</h1>
  <div class="meta-info">
    日期：<span id="currentDate">載入中...</span> | 
    最後更新：<span id="lastUpdated">--:--:--</span>
  </div>
</div>

<div class="grid-container" id="dashboard">
  <div class="loading-full">正在連線取得即時缺曠看板...</div>
</div>

<script>
  // ⚠️ 請替換為你的 GAS 部署網址 ⚠️
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyEy9Ju1JMJoBWC4PbJ1rT9ODeNdpvySF_Gqh0CGvkuEOMm9fpUAXqOibLNnq7NhWl7/exec";

  // 全域 JSONP 回呼函數
  window.handleDashboardData = function(response) {
    console.log("看板收到資料:", response);
    
    document.getElementById('currentDate').innerText = response.date || '--';
    document.getElementById('lastUpdated').innerText = response.lastUpdated || new Date().toLocaleTimeString('zh-TW');

    const container = document.getElementById('dashboard');
    container.innerHTML = '';

    const summary = response.data || {};
    const classNames = Object.keys(summary);

    if (classNames.length === 0) {
      container.innerHTML = '<div class="loading-full">目前尚無任何班級缺曠紀錄（全員到齊）</div>';
      return;
    }

    classNames.forEach(className => {
      const records = summary[className] || [];
      const card = document.createElement('div');
      card.className = 'class-card';

      let contentHtml = '';
      if (records.length === 0) {
        contentHtml = `
          <div class="class-title">${className} 班 <span class="badge-all">全員到齊</span></div>
          <div class="all-present">✓ 無缺曠紀錄</div>
        `;
      } else {
        contentHtml = `
          <div class="class-title">${className} 班 <span class="badge-absent">缺曠 ${records.length} 人</span></div>
          <ul class="student-list">
        `;
        records.forEach(item => {
          contentHtml += `
            <li class="student-item">
              <span>${item.seat}號 ${item.name}</span>
              <span class="type-tag tag-${item.type}">${item.type}</span>
            </li>
          `;
        });
        contentHtml += `</ul>`;
      }

      card.innerHTML = contentHtml;
      container.appendChild(card);
    });
  };

  function refreshDashboard() {
    const oldScript = document.getElementById('dashboard-script');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'dashboard-script';
    // 呼叫 doGet 預設模式（取得今日缺曠）
    script.src = `${GAS_URL}?callback=handleDashboardData&_=${new Date().getTime()}`;
    document.body.appendChild(script);
  }

  // 立即載入
  refreshDashboard();

  // 每 10 秒自動重新整理
  setInterval(refreshDashboard, 10000);
</script>

</body>
</html>
